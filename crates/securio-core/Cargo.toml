[package]
name = "securio-core"
description = "Cœur cryptographique de Securio : formats .encrypted v1, v2 et v3"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc", "zeroize"] }
getrandom = "0.4"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
thiserror = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
base64 = "0.23"
serde_json = "1"
unicode-normalization = "0.1"
sha2 = "0.11"
