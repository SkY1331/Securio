[workspace]
resolver = "2"
members = ["crates/securio-core", "src-tauri"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
authors = ["SkY1331"]

# La cryptographie est très lente sans optimisation : on optimise ces crates
# même en mode debug (tests, `tauri dev`).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.securio-core]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
