name: Build

on:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publication des exécutables sur les releases (tags v*)

jobs:
  test:
    name: Tests (rétro-compatibilité incluse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx eslint .
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Exécutables Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tauri build
      - name: Renommer l'exécutable portable
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item target/release/securio.exe "target/release/Securio-$v-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Securio-windows
          path: |
            target/release/Securio-*-portable.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: Publier sur la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/Securio-*-portable.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
